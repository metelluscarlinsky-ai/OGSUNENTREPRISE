<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - OGSUNENTERPRISE</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
  .toast { background: #121216; border: 1px solid #333; border-left: 4px solid #FFB800; color: #fff; padding: 14px 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(150%); transition: transform 0.3s; }
  .toast.show { transform: translateX(0); }
  .toast-success { border-left-color: #30d158; }
  .toast-error { border-left-color: #ef4444; }
</style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 24px;"><div class="logo">OGSUN<span style="color:white">ENTERPRISE</span></div></div>
    <form id="adminLoginForm">
      <div class="field"><label>Modpas Admin</label><input type="password" id="adminPass" required></div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Konekte</button>
    </form>
  </div>
</div>

<div id="appView" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand">OGSUN <span>Admin</span></div>
    <nav>
      <a href="#" data-tab="affiliates" class="active">👥 Afilye</a>
      <a href="#" data-tab="tasks">📋 Travay Afilye</a>
      <a href="#" data-tab="customers">🛍️ Tout Kliyan yo</a>
      <a href="#" data-tab="notifications">🔔 Notifikasyon</a>
      <a href="#" data-tab="analytics">📊 Analytik</a>
      <a href="#" id="logoutBtn" class="logout">🚪 Dekonekte</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar"><h1 id="pageTitle">Jesyon Afilye</h1></div>

    <div id="tab-affiliates" class="tab-panel active">
      <div class="table-wrap"><table><thead><tr><th>Non</th><th>Imèl</th><th>Kòd Ref</th><th>Estati</th><th>Aksyon</th></tr></thead><tbody id="affiliatesBody"></tbody></table></div>
    </div>

    <div id="tab-tasks" class="tab-panel">
      <div class="table-wrap"><table><thead><tr><th>Dat</th><th>Afilye</th><th>Travay</th><th>Prèv</th><th>Estati</th><th>Aksyon</th></tr></thead><tbody id="tasksBody"></tbody></table></div>
    </div>

    <!-- KLIYAN AK SIT -->
    <div id="tab-customers" class="tab-panel">
      <div class="card mb-3">
        <h3 class="mb-2">Ajoute yon Vant Manyèl</h3>
        <form id="saleForm" class="sale-form-grid">
          <div class="field"><select id="saleAffiliate" required></select></div>
          <div class="field"><input type="text" id="saleCustomer" placeholder="Non Kliyan" required></div>
          <div class="field"><input type="number" id="saleAmount" placeholder="Montan HTG" required></div>
          <div class="field"><select id="saleSite"><option>Shop Online</option><option>Order Food</option><option>OGCARS</option></select></div>
          <div class="full"><button type="submit" class="btn btn-primary">Anrejistre Vant</button></div>
        </form>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Dat</th><th>Kliyan</th><th>Sit</th><th>Afilye (Kòd)</th><th>Montan</th><th>Komisyon</th></tr></thead>
          <tbody id="customersBody"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-notifications" class="tab-panel">
      <div class="card mb-3">
        <form id="notifForm">
          <div class="field"><select id="notifTarget"><option value="all">Tout moun</option></select></div>
          <div class="field"><textarea id="notifMessage" required></textarea></div>
          <button type="submit" class="btn btn-primary">Voye</button>
        </form>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Dat</th><th>Afilye</th><th>Mesaj</th></tr></thead><tbody id="notifsBody"></tbody></table></div>
    </div>

    <div id="tab-analytics" class="tab-panel">
      <div class="stats-grid" id="analyticsStats"></div>
      <div class="card"><div style="position: relative; height: 350px;"><canvas id="salesChart"></canvas></div></div>
    </div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function showToast(msg, type='success') {
  const c = $('#toastContainer');
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 4000);
}

async function api(url, opts={}) {
  const r = await fetch(url, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opts });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erè');
  return d;
}

$('#adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await api('/api/auth/admin-login', { method: 'POST', body: JSON.stringify({ password: $('#adminPass').value }) }); showApp(); } 
  catch (err) { showToast(err.message, 'error'); }
});

async function showApp() {
  $('#loginView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  await Promise.all([loadAffiliates(), loadTasks(), loadCustomers(), loadNotifs(), loadAnalytics()]);
}
checkAuth();
async function checkAuth() { try { const me = await api('/api/auth/me'); if (me.role === 'admin') showApp(); } catch {} }

$$('.sidebar nav a[data-tab]').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    $$('.sidebar nav a[data-tab]').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    $$('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + a.dataset.tab).classList.add('active');
    $('#pageTitle').textContent = a.textContent.trim();
  });
});

$('#logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); await api('/api/auth/logout', { method: 'POST' }); location.reload(); });

async function loadAffiliates() {
  const list = await api('/api/admin/affiliates');
  $('#affiliatesBody').innerHTML = list.map(a => `
    <tr>
      <td><strong>${esc(a.name)}</strong></td><td>${esc(a.email)}</td><td>${esc(a.referral_code)}</td>
      <td><span class="badge badge-${a.status}">${a.status}</span></td>
      <td>${a.status !== 'active' ? `<button class="btn btn-sm btn-success" onclick="setStatus(${a.id},'active')">Aktive</button>` : `<button class="btn btn-sm btn-danger" onclick="setStatus(${a.id},'suspended')">Sispann</button>`}</td>
    </tr>
  `).join('');
  $('#saleAffiliate').innerHTML = '<option value="">-- Chwazi --</option>' + list.map(a => `<option value="${a.id}">${esc(a.name)} (${esc(a.referral_code)})</option>`).join('');
  $('#notifTarget').innerHTML = '<option value="all">Tout moun</option>' + list.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
}

async function setStatus(id, status) {
  try { await api(`/api/admin/affiliates/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) }); showToast('Estati chanje!'); loadAffiliates(); }
  catch (e) { showToast(e.message, 'error'); }
}

async function loadTasks() {
  const list = await api('/api/admin/tasks');
  $('#tasksBody').innerHTML = list.map(t => `
    <tr>
      <td>${new Date(t.created_at).toLocaleDateString()}</td>
      <td>${esc(t.affiliate_name)}</td>
      <td>${esc(t.description)}</td>
      <td>${t.proof_url ? `<span class="text-muted" style="font-size:0.8rem;">${esc(t.proof_url)}</span>` : '-'}</td>
      <td><span class="badge badge-${t.status==='approved'?'active':t.status==='rejected'?'suspended':'pending'}">${t.status}</span></td>
      <td>${t.status==='pending' ? `
        <button class="btn btn-sm btn-success" onclick="setTaskStatus(${t.id},'approved')">Apwouve</button>
        <button class="btn btn-sm btn-danger" onclick="setTaskStatus(${t.id},'rejected')">Rejte</button>
      ` : '-'}</td>
    </tr>
  `).join('');
}

async function setTaskStatus(id, status) {
  try { await api(`/api/admin/tasks/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) }); showToast('Travay ajou!'); loadTasks(); }
  catch (e) { showToast(e.message, 'error'); }
}

async function loadCustomers() {
  const list = await api('/api/admin/customers');
  $('#customersBody').innerHTML = list.map(c => `
    <tr>
      <td>${new Date(c.created_at).toLocaleDateString()}</td>
      <td><strong>${esc(c.customer_name)}</strong></td>
      <td><span class="badge badge-pending">${esc(c.site_source)}</span></td>
      <td>${esc(c.affiliate_name)} (${esc(c.referral_code || 'N/A')})</td>
      <td>${Number(c.amount).toFixed(2)} HTG</td>
      <td style="color:#FFB800;">${Number(c.commission).toFixed(2)} HTG</td>
    </tr>
  `).join('');
}

$('#saleForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/api/admin/sales', {
      method: 'POST',
      body: JSON.stringify({
        affiliate_id: parseInt($('#saleAffiliate').value),
        customer_name: $('#saleCustomer').value,
        amount: parseFloat($('#saleAmount').value),
        site_source: $('#saleSite').value
      })
    });
    showToast('Vant anrejistre!');
    e.target.reset();
    loadCustomers();
  } catch (err) { showToast(err.message, 'error'); }
});

async function loadNotifs() {
  const list = await api('/api/admin/notifications');
  $('#notifsBody').innerHTML = list.map(n => `<tr><td>${new Date(n.created_at).toLocaleString()}</td><td>${esc(n.affiliate_name)}</td><td>${esc(n.message)}</td></tr>`).join('');
}

$('#notifForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await api('/api/admin/notifications', { method: 'POST', body: JSON.stringify({ affiliate_id: $('#notifTarget').value, message: $('#notifMessage').value }) }); showToast('Mesaj voye!'); e.target.reset(); loadNotifs(); }
  catch (err) { showToast(err.message, 'error'); }
});

let chart = null;
async function loadAnalytics() {
  const d = await api('/api/admin/analytics');
  $('#analyticsStats').innerHTML = `
    <div class="stat"><div class="label">Revni</div><div class="value">${Number(d.totals.revenue).toFixed(2)}</div></div>
    <div class="stat"><div class="label">Komisyon</div><div class="value">${Number(d.totals.commission).toFixed(2)}</div></div>
    <div class="stat"><div class="label">Vant</div><div class="value">${d.totals.sales_count}</div></div>
  `;
  if (chart) chart.destroy();
  chart = new Chart($('#salesChart'), { type: 'line', data: { labels: d.monthly.map(m=>m.month), datasets: [{ data: d.monthly.map(m=>Number(m.total_sales)), borderColor: '#FFB800', fill: true, backgroundColor: 'rgba(255,184,0,0.1)' }] }, options: { responsive: true, maintainAspectRatio: false } });
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
</script>
</body>
</html>
