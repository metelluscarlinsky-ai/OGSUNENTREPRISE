services:
  - type: web
    name: ogsunentreprise
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: Carlinsky
      - key: DATABASE_URL
        fromDatabase:
          name: ogsun-db
          property: connectionString

databases:
  - name: ogsun-db
    plan: free
    databaseName: ogsun
    user: ogsun
